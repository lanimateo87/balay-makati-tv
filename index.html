    <style>
      /* The viewport is only a letterbox; everything lives on a fixed 1920x1080 stage scaled to fit. */
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #211a15; }
      .x-tv {
        --x-bg: #211a15; --x-cream: #f3eadc; --x-gold: #c99660;
        --x-serif: "Cormorant Garamond", "Cormorant", Georgia, "Times New Roman", serif;
        --x-sans: "Geist", var(--sans), "Helvetica Neue", Arial, sans-serif;
        position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; overflow: hidden;
        transform: translate(-50%, -50%) scale(0.5); transform-origin: 50% 50%;
        background: var(--x-bg); color: var(--x-cream); font-family: var(--x-sans);
        max-width: none; min-height: 0; margin: 0; padding: 0; box-sizing: border-box;
      }
      .x-photo { position: absolute; top: 0; left: 0; width: 1114px; height: 1080px; }
      .x-photo__img { width: 100%; height: 100%; max-width: none; object-fit: cover; display: block; }
      .x-photo::after {
        content: ""; position: absolute; top: 0; right: 0; bottom: 0; left: 0;
        background: linear-gradient(90deg, rgba(33,26,21,0) 0%, rgba(33,26,21,0) 55%, rgba(33,26,21,.55) 78%, #211a15 100%),
                    linear-gradient(0deg, rgba(33,26,21,.55) 0%, rgba(33,26,21,0) 35%);
      }
      .x-insets { position: absolute; left: 58px; bottom: 54px; width: 922px; display: flex; justify-content: space-between; align-items: flex-end; z-index: 2; }
      .x-inset { margin: 0; width: 212px; background: var(--x-cream); padding: 8px; border-radius: 6px; box-shadow: 0 13px 32px rgba(0,0,0,.45); box-sizing: border-box; }
      .x-inset img { display: block; width: 100%; height: 261px; object-fit: cover; border-radius: 3px 3px 0 0; }
      .x-inset figcaption { background: rgba(33,26,21,.88); color: var(--x-cream); font: 500 24px/1.1 var(--x-sans); letter-spacing: .04em; text-transform: uppercase; text-align: center; padding: 10px 4px; border-radius: 0 0 3px 3px; overflow-wrap: anywhere; }

      .x-panel {
        position: absolute; top: 0; right: 0; width: 864px; height: 1080px; box-sizing: border-box;
        padding: 64px 86px 52px 58px; display: flex; flex-direction: column; z-index: 1; overflow: hidden;
      }
      .x-kicker { margin: 0; font: 600 24px/1 var(--x-sans); letter-spacing: .3em; text-transform: uppercase; color: var(--x-gold); }
      .x-headline {
        margin: 22px 0 0; font: 500 116px/1 var(--x-serif); color: var(--x-cream); letter-spacing: -.01em;
        white-space: nowrap; overflow: hidden;
        opacity: 0; animation: x-fade 3.5s ease-out .4s forwards;
      }
      @keyframes x-fade { from { opacity: 0; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .x-headline { animation: none; opacity: 1; } }
      .x-tagline { margin: 24px 0 0; font: 500 24px/1 var(--x-sans); letter-spacing: .4em; color: var(--x-cream); opacity: .85; }
      .x-tagline span { color: var(--x-gold); padding: 0 .5em; }
      .x-rule { width: 115px; height: 3px; background: var(--x-gold); border: 0; margin: 30px 0 22px; }
      .x-lead { margin: 0; font: italic 500 38px/1.25 var(--x-serif); color: var(--x-cream); }
      .x-stay { margin: 20px 0 0; font: 400 24px/1.5 var(--x-sans); color: var(--x-cream); opacity: .9; }
      .x-stay b { color: var(--x-gold); font-weight: 500; }
      .x-stay[hidden], .x-stay span[hidden] { display: none; }
      .x-sep { color: var(--x-gold); padding: 0 .6em; }

      /* QR: 324px of a 1080px stage = 30% of screen height, never allowed to shrink. */
      .x-guide { margin-top: auto; padding-top: 20px; display: flex; align-items: center; gap: 44px; flex: none; }
      .x-qr { flex: none; width: 324px; height: 324px; box-sizing: border-box; padding: 22px; background: #fff; border-radius: 22px; box-shadow: 0 13px 32px rgba(0,0,0,.35); }
      .x-qr img { display: block; width: 280px; height: 280px; max-width: none; image-rendering: pixelated; image-rendering: crisp-edges; }
      .x-guide__title { margin: 0 0 16px; font: 600 41px/1.1 var(--x-serif); color: var(--x-cream); }
      .x-guide__list { list-style: none; margin: 0; padding: 0; font: 400 24px/1.65 var(--x-sans); color: var(--x-cream); opacity: .9; }
      .x-guide__list li::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--x-gold); margin-right: 12px; vertical-align: middle; }

      .x-clock { flex: none; margin: 34px 0 0; padding-top: 20px; border-top: 1px solid rgba(201,150,96,.35); display: flex; align-items: baseline; justify-content: space-between; }
      .x-clock__time { font: 500 43px/1 var(--x-serif); color: var(--x-cream); }
      .x-clock__label { font: 500 24px/1 var(--x-sans); letter-spacing: .28em; text-transform: uppercase; color: var(--x-gold); }
    </style>

    <script>
      // === GUEST CONFIG: edit only this block ===
      const GUEST = { firstName: "Rigor", stayDates: "Oct 28 – Nov 5", checkout: "Thu, Nov 5, 12:00 PM" };
      // === END GUEST CONFIG ===

      (function () {
        var clean = function (v) { return typeof v === "string" ? v.trim() : ""; };
        var name = clean(GUEST.firstName), dates = clean(GUEST.stayDates), out = clean(GUEST.checkout);
        var $ = function (id) { return document.getElementById(id); };

        $("x-headline").textContent = name ? "Welcome, " + name : "Welcome home";
        if (dates) { $("x-dates").textContent = dates; $("x-stay-dates").hidden = false; }
        if (out) { $("x-checkout").textContent = out; $("x-stay-out").hidden = false; }
        if (dates && out) $("x-stay-sep").hidden = false;
        if (dates || out) $("x-stay").hidden = false;

        var dateFmt, timeFmt;
        try {
          dateFmt = new Intl.DateTimeFormat("en-US", { timeZone: "Asia/Manila", weekday: "short", month: "short", day: "numeric" });
          timeFmt = new Intl.DateTimeFormat("en-US", { timeZone: "Asia/Manila", hour: "numeric", minute: "2-digit", hour12: true });
        } catch (e) {
          dateFmt = timeFmt = null;
        }
        function tick() {
          var now = new Date();
          if (dateFmt) {
            $("x-clock").textContent = dateFmt.format(now) + " · " + timeFmt.format(now);
          } else {
            // Fallback: Manila is UTC+8 with no daylight saving.
            var m = new Date(now.getTime() + 8 * 3600 * 1000);
            var days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], mons = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
            var h = m.getUTCHours(), mm = ("0" + m.getUTCMinutes()).slice(-2);
            $("x-clock").textContent = days[m.getUTCDay()] + ", " + mons[m.getUTCMonth()] + " " + m.getUTCDate() + " · " + ((h % 12) || 12) + ":" + mm + (h < 12 ? " AM" : " PM");
          }
        }
        tick();
        setInterval(tick, 30000);

        // Reload every 15 minutes so the TV picks up config edits.
        setTimeout(function () { location.reload(); }, 15 * 60 * 1000);
      })();
    </script>
    <script>
      // 16:9 stage: scale the 1920x1080 layout by min(vw/1920, vh/1080), centered and letterboxed.
      (function () {
        var stage = document.getElementById("top");
        var head = document.getElementById("x-headline");
        function fitStage() {
          var de = document.documentElement;
          var w = window.innerWidth || de.clientWidth, h = window.innerHeight || de.clientHeight;
          var s = Math.min(w / 1920, h / 1080);
          var t = "translate(-50%, -50%) scale(" + s + ")";
          stage.style.webkitTransform = t;
          stage.style.transform = t;
        }
        // Keep a long guest name on one line by shrinking it to the panel width.
        function fitHeadline() {
          var size = 116;
          head.style.fontSize = size + "px";
          while (head.scrollWidth > head.clientWidth && size > 56) {
            size -= 2;
            head.style.fontSize = size + "px";
          }
        }
        function fitAll() { fitStage(); fitHeadline(); }
        fitAll();
        window.addEventListener("resize", fitAll);
        window.addEventListener("orientationchange", fitAll);
        window.addEventListener("load", fitAll);
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);
      })();
    </script>
  </body>
</html>
